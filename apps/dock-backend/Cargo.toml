[package]
name = "nyx-dock-backend"
version = "0.1.0"
description = "Nyx Dock without GTK: items, hiding, launching, cards, folders and previews, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-dock-backend"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gio = { version = "0.22", features = ["v2_80"] }
gio-unix = "0.22"
glib = "0.22"
gtk = { path = "../../crates/nyx-gtk-shim", package = "nyx-gtk-shim" }
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68", features = ["capture"] }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "f68ecc891cd0d5a36b6ed29e93ed5ffc52e77acc", features = ["watch"] }
nyx-dock-core = { path = "../../crates/nyx-dock-core" }
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6c139d893bdb01f3bd87801e08361b3b3c36591e" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
serde = "1"
serde_json = "1"
