[package]
name = "nyx-dock-backend"
version = "0.1.0"
description = "Nyx Dock without GTK: items, hiding, launching, cards, folders and previews, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-dock-backend"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gio = { version = "0.22", features = ["v2_80"] }
gio-unix = "0.22"
glib = "0.22"
gtk = { path = "../../crates/nyx-gtk-shim", package = "nyx-gtk-shim" }
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411", features = ["capture"] }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "3f3c454cdf34cfce571a5ff3802a25817e9301f9", features = ["watch"] }
nyx-dock-core = { path = "../../crates/nyx-dock-core" }
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
serde = "1"
serde_json = "1"
