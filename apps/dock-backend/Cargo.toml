[package]
name = "nyx-dock-backend"
version = "0.1.0"
description = "Nyx Dock without GTK: items, hiding, launching, cards, folders and previews, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-dock-backend"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gio = { version = "0.22", features = ["v2_80"] }
gio-unix = "0.22"
glib = "0.22"
gtk = { path = "../../crates/nyx-gtk-shim", package = "nyx-gtk-shim" }
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4f05fb8fc92ec211f4e0f0b722fdf29a083c9e89", features = ["capture"] }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "f68ecc891cd0d5a36b6ed29e93ed5ffc52e77acc", features = ["watch"] }
nyx-dock-core = { path = "../../crates/nyx-dock-core" }
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "cf393978364ca7b2a309a88a8d1651bf9d338916" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4f05fb8fc92ec211f4e0f0b722fdf29a083c9e89" }
serde = "1"
serde_json = "1"
