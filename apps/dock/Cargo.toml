[package]
name = "nyx-dock"
version = "0.1.0"
description = "Nyx Dock: a floating app dock for Omarchy and Hyprland"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-dock"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gio-unix = "0.22"
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821", features = ["capture"] }
nyx-dock-core = { path = "../../crates/nyx-dock-core" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "318a2a43c294fed7c979003025dbe997a1cf9ce4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
