[package]
name = "nyx-dock"
version = "0.1.0"
description = "Nyx Dock: a floating app dock for Omarchy and Hyprland"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-dock"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gio-unix = "0.22"
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "f94be28d308e3aafd44a72ecebe45e8567bfcb1d" }
nyx-dock-core = { path = "../../crates/nyx-dock-core" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "976fed940841a2a505ffe644f632cb60e12988a8" }
serde_json = "1"
