[package]
name = "nyx-dock"
version = "0.1.0"
description = "Nyx Dock: a floating app dock for Omarchy and Hyprland"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-dock"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gio-unix = "0.22"
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411", features = ["capture"] }
nyx-dock-core = { path = "../../crates/nyx-dock-core" }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "3f3c454cdf34cfce571a5ff3802a25817e9301f9" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
