[package]
name = "nyx-dock-core"
version = "0.1.0"
description = "The dock's logic without GTK: settings, app matching, items, hiding"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "c6590d4194f8f5857e23fcf1b52ca171a2202c92", default-features = false }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "f68ecc891cd0d5a36b6ed29e93ed5ffc52e77acc", features = ["watch"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
